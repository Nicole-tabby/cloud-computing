{% extends "base.html" %}
{% block content %}
<h3>Doctor Registration</h3>
<form method="post" class="card card-body mb-4">
  <div class="row g-3">
    <div class="col-md-6"><input class="form-control" name="name" placeholder="Doctor name (e.g. Dr. Kumar)" required></div>
    <div class="col-md-6"><input class="form-control" name="specialization" placeholder="Specialization (e.g. Cardiology)" required></div>
    <div class="col-md-6"><input class="form-control" type="email" name="email" placeholder="Email"></div>
    <div class="col-md-6"><input class="form-control" name="phone" placeholder="Phone"></div>
  </div>
  <button class="btn btn-primary mt-3">Register Doctor</button>
</form>

<h5>Registered Doctors</h5>
<table class="table table-striped bg-white">
  <thead><tr><th>Name</th><th>Specialization</th><th>Email</th><th>Phone</th></tr></thead>
  <tbody>
  {% for d in doctors %}
    <tr><td>{{ d.doctor }}</td><td>{{ d.specialization }}</td><td>{{ d.email }}</td><td>{{ d.phone }}</td></tr>
  {% else %}
    <tr><td colspan="4" class="text-muted">No doctors yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
