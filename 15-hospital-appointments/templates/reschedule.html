{% extends "base.html" %}
{% block content %}
<h3>Reschedule Appointment</h3>
<p>{{ appt.patient }} with {{ doctor.doctor }} (currently {{ appt.date }} at {{ appt.time }})</p>
<form method="post" class="card card-body">
  <div class="row g-3">
    <div class="col-md-6"><input class="form-control" type="date" name="date" value="{{ appt.date }}" required></div>
    <div class="col-md-6"><input class="form-control" type="time" name="time" value="{{ appt.time }}" required></div>
  </div>
  <button class="btn btn-primary mt-3">Save New Time</button>
  <a class="btn btn-link mt-3" href="{{ url_for('search_appointments') }}">Back</a>
</form>
{% endblock %}
