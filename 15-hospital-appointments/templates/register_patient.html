{% extends "base.html" %}
{% block content %}
<h3>Patient Registration</h3>
<form method="post" class="card card-body mb-4">
  <div class="row g-3">
    <div class="col-md-6"><input class="form-control" name="name" placeholder="Patient name" required></div>
    <div class="col-md-6"><input class="form-control" type="number" name="age" placeholder="Age" min="0" required></div>
    <div class="col-md-6"><input class="form-control" name="phone" placeholder="Phone"></div>
    <div class="col-md-6"><input class="form-control" type="email" name="email" placeholder="Email"></div>
  </div>
  <button class="btn btn-primary mt-3">Register Patient</button>
</form>

<h5>Registered Patients</h5>
<table class="table table-striped bg-white">
  <thead><tr><th>Name</th><th>Age</th><th>Phone</th><th>Email</th></tr></thead>
  <tbody>
  {% for p in patients %}
    <tr><td>{{ p.name }}</td><td>{{ p.age }}</td><td>{{ p.phone }}</td><td>{{ p.email }}</td></tr>
  {% else %}
    <tr><td colspan="4" class="text-muted">No patients yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
